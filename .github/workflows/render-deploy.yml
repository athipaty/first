# Render ไม่ auto-deploy เว็บนี้เองเมื่อ main เปลี่ยน จึงให้ GitHub สั่ง deploy แทน
# ผ่าน Deploy Hook ของ Render (ตั้งค่า secret RENDER_DEPLOY_HOOK_URL ที่
# GitHub > Settings > Secrets and variables > Actions)
name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set (Render > direkair > Settings > Deploy Hook)"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy triggered"
