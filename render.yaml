# Render Blueprint: https://render.com/docs/blueprint-spec
# ใช้ใน Render Dashboard > New > Blueprint แล้วเลือก repo นี้
services:
  - type: web
    name: direkair
    runtime: node
    region: singapore
    plan: starter # persistent disk ใช้กับแพ็กเกจฟรีไม่ได้
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/me
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false # ตั้งค่าเองตอนสร้าง service (จะไม่ถูกเก็บใน repo)
    disk:
      name: direkair-data
      mountPath: /var/data
      sizeGB: 1
